<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Luckiest; src: url(luckiest.ttf); }
@font-face { font-family: Lilita; src: url(lilita.ttf); }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #1c0b45; }
svg { position: absolute; inset: 0; }
</style></head>
<body><svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script src="common.js"></script>
<script src="style.js"></script>
<script>
const R = rng(23);
let g = `<defs>${DEFS}</defs>` + skyBurst(1420, 150, R);

// Tower on the right, current floor (x50) lit up, top ledge cracking
const T = tower({ cx: 1420, baseY: 1180, topY: 290, baseW: 900, topW: 250, mults: MULTS, R, highlight: 5, breakLedge: 6 });
g += T.svg;
const shirts = ['#ff4757', '#2f7bff', '#ffb800', '#22c55e', '#a855f7', '#ff7a1a'];
T.floors.forEach((f, i) => {
  if (f.yb > 1080) return;
  const u = 15 * f.k;
  [-0.3, 0.3].forEach((dx, j) => {
    if ((i + j) % 3 === 1) return;
    g += avatar(1420 + dx * f.wb, f.yb - 8 * f.k, u, { shirt: shirts[(i * 2 + j) % 6], face: i >= 5 ? 'shock' : 'smile' });
  });
});
// Money bag on top
const topY = T.ys[T.ys.length - 1];
g += `<ellipse cx="1420" cy="${topY - 10}" rx="230" ry="60" fill="#ffd34a" opacity=".5" filter="url(#glow)"/>`;
[[-120, -2, 20], [-95, -12, 18], [112, -2, 20], [132, -14, 16], [88, -14, 16]].forEach(([dx, dy, r]) => g += coin(1420 + dx, topY + dy, r, 0.15));
g += moneyBag(1420, topY - 4, 0.56);

// Players falling off the tower
g += avatar(1790, 420, 22, { shirt: '#a855f7', face: 'shock', la: 150, ra: -150, rot: 40 });
g += avatar(1860, 700, 18, { shirt: '#2f7bff', face: 'shock', la: 140, ra: -160, rot: -150 });
g += avatar(1060, 470, 20, { shirt: '#ff7a1a', face: 'shock', la: 150, ra: -150, rot: -30 });

// Hero slamming the CASH OUT button
g += `<circle cx="560" cy="700" r="330" fill="#ff3b3b" opacity=".4" filter="url(#glow)"/>`;
// Burst behind the button
g += `<path d="${Array.from({ length: 28 }, (_, i) => { const a = i * Math.PI / 14, r = i % 2 ? 230 : 380; return (i ? 'L' : 'M') + (560 + Math.cos(a) * r) + ',' + (690 + Math.sin(a) * r * 0.8); }).join(' ')}Z" fill="#ffe14a" stroke="${BROWN}" stroke-width="10" stroke-linejoin="round"/>`;
g += avatar(560, 790, 82, { shirt: '#ff4757', pants: '#26304f', face: 'excited', la: -18, ra: 18, hair: '#3b2414' });
g += redButton(560, 850, 1.3, true);
// Impact lines
g += `<path d="M300,700 l-60,-20 M290,780 l-70,10 M820,700 l60,-20 M830,780 l70,10" stroke="#fff" stroke-width="12" stroke-linecap="round"/>`;
// Coins and cash exploding out
[[260, 520, 30, .3], [850, 480, 34, 1.2], [200, 690, 26, 2.1], [930, 640, 28, .7], [330, 400, 24, 1.6], [790, 360, 26, 2.6], [130, 880, 28, .9], [990, 880, 30, 1.9]].forEach(([x, y, r, a]) => g += coin(x, y, r, a));
[[150, 520, 130, -28], [960, 500, 130, 24], [420, 330, 110, -10], [700, 300, 110, 16]].forEach(([x, y, w, r]) => g += bill(x, y, w, r));
[[230, 420, 22], [900, 380, 26], [120, 760, 18], [1010, 740, 20]].forEach(([x, y, r]) => g += sparkle(x, y, r, '#fffbe0'));

// Foreground + text
g += snowHill(960);
g += goldTitle('CASH OUT!', 560, 225, 205, -4);
g += `<g transform="translate(560 985) rotate(-3)">
  <rect x="-300" y="-56" width="600" height="112" rx="56" fill="#2fc24a" stroke="${BROWN}" stroke-width="10"/>
  <rect x="-280" y="-46" width="560" height="34" rx="17" fill="#fff" opacity=".3"/>
  <text y="24" font-family="Luckiest" font-size="68" text-anchor="middle" fill="#fff" stroke="${BROWN}" stroke-width="10" paint-order="stroke">+$50,000!</text></g>`;
g += whiteText('OR KEEP', 1420, 900, 84, 4) + whiteText('CLIMBING?', 1420, 990, 84, 4, '#ffe04a');

document.getElementById('s').innerHTML = g;
</script></body></html>
